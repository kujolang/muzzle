name: "Muzzle launch readiness review"
goal: "Keep Muzzle locally release-ready as a Kujo-native quiet workflow runner with deterministic wrapper behavior, compact summaries, local logs/reports, and scoped safety claims."
version: "1.0.0"
background: "Muzzle is part of the Kujo prelaunch ecosystem review. The verified scope is trusted local workflow compression; workflow scripts are local code and are not sandboxed."
scope: "Repository-local CLI behavior, wrapper compatibility, workflow initialization/execution, JSON summaries, log/report capture, secret redaction in summaries, docs/readiness wording, and launch evidence capture."
non_goals:
  - "Publishing packages or public releases"
  - "Running deploy, publish, destructive, networked, or production-like workflows without explicit approval"
  - "Claiming sandboxing or enterprise platform API stability"
relevant_systems:
  - "Kujo runtime"
  - "Muzzle wrapper"
  - "repo-local .muzzle workflows"
  - "prelaunch launch evidence packet"
likely_files:
  - "README.md"
  - "muzzle"
  - "muzzle.kujo"
  - "src/runner.kujo"
  - "src/workflow.kujo"
  - "src/report.kujo"
  - "src/redact.kujo"
  - "tests/muzzle_wrapper_regression.sh"
acceptance_criteria:
  - "`muzzle --help`, `muzzle version`, and `muzzle --version` print documented output and exit 0."
  - "Wrapper regression suite passes locally with `KUJO_BIN=kujo`."
  - "Eval suite proves help, named version, wrapper regression, and package metadata."
  - "ShipCheck and Concord pass locally."
  - "README version badge matches `kennel.toml` and CLI output."
  - "Docs remain clear that Muzzle is not a sandbox and risky workflows require review/dry-run/human approval."
eval_requirements:
  - description: "Run Muzzle help."
    check_type: "command"
    params:
      command: "KUJO_BIN=kujo ./muzzle --help"
  - description: "Run named version command."
    check_type: "command"
    params:
      command: "KUJO_BIN=kujo ./muzzle version"
  - description: "Run wrapper regression suite."
    check_type: "command"
    params:
      command: "KUJO_BIN=kujo bash tests/muzzle_wrapper_regression.sh"
risks:
  - risk: "Workflow scripts run as local code with current process privileges."
    mitigation: "Keep sandbox limits explicit in docs and require dry-run/review/human approval for sensitive workflows."
    severity: "high"
  - risk: "Secret redaction is pattern-based and may miss unknown secret formats."
    mitigation: "Do not print secrets; keep logs/reports local and out of version control."
    severity: "medium"
dependencies:
  - "kujo on PATH or KUJO_BIN set"
  - "Bash 3.2+"
review_expectations:
  - "Review workflow manifests before running risky project workflows."
  - "Review wrapper regression evidence and JSON output contract before launch sign-off."
human_approval_points:
  - "Before publishing packages or public releases"
  - "Before running deploy, publish, destructive, networked, or production-like workflows"
  - "Before claiming sandboxing or enterprise API stability"
priority: "high"
tags:
  - "kujo"
  - "muzzle"
  - "launch-readiness"
