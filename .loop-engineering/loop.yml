objective: "Evaluate HLP-004 migration to the first-party CLI parser package and classify it needs-contract-first when package wiring cannot preserve Muzzle flag semantics."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: kujo_checks
    command: "for f in muzzle.kujo src/*.kujo; do /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check $f >/dev/null || exit 1; done"
  - id: wrapper_regression
    command: "KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo bash tests/muzzle_wrapper_regression.sh"
  - id: diff_check
    command: "git diff --check -- $(git diff --name-only | grep -v '^.loop-engineering/' || true)"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
